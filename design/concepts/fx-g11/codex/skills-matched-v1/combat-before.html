<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Feel</title>
<style>
  :root { --bg:#14141c; --panel:#1e1e2a; --text:#e8e6f0; --muted:#9a98aa; --accent:#ffb347; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 8px; }
  canvas { width:100%; max-width:840px; image-rendering:pixelated; background:#0d0d14; border-radius:8px; display:block; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; align-items:center; }
  .row b { width:70px; color:var(--muted); font-weight:500; }
  button { background:var(--panel); color:var(--text); border:1px solid #33334a; border-radius:6px; padding:6px 10px; cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); }
  input[type=range] { width:180px; }
  .note { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ทดลองความแรง · Mara vs Kiki</h1>
  <canvas id="c" width="280" height="120"></canvas>
  <div class="row"><b>ท่า</b><span id="moves"></span></div>
  <div class="row"><b>ธาตุ</b><span id="elems"></span></div>
  <div class="row"><b>เอฟเฟกต์</b><span id="fxsets"></span></div>
  <div class="row"><b>ดาบ</b><span id="blades"></span></div>
  <div class="row"><b>หินเสริม</b><button id="boom">ระเบิด</button></div>
  <div class="row"><b>ความเร็ว</b><input id="speed" type="range" min="0.6" max="1.6" step="0.05" value="1"><span id="speedv"></span></div>
  <div class="row"><b>Hit stop</b><input id="stop" type="range" min="0" max="160" step="10" value="80"><span id="stopv"></span></div>
  <div class="row"><b>จอสั่น</b><input id="shake" type="range" min="0" max="8" step="1" value="3"><span id="shakev"></span></div>
  <div class="row"><b></b><button id="auto" class="on">ตีอัตโนมัติ</button><button id="ai">ต่อสู้อัตโนมัติ (AI)</button><button id="chain">รันทุกท่าต่อกัน</button><button id="hit">ตี 1 ครั้ง (Space)</button></div>
  <p class="note">เอฟเฟกต์ใหม่: ระเบิด 16 เฟรม · ไฟ / น้ำแข็งแตก / พิษสาด อย่างละ 12 เฟรม · ปะทะตรงตัวมอน เลือกชุดเดิมเพื่อเทียบได้</p>
</div>
<script>
const M = '../../motion/';

  'sk-rising': { label:'เสยขึ้น', base:M+'mara/skills/rising/', raw:'strip-fast.png', blade:n=>n==7?'strip-fast-blade-7.png':'strip-fast.png', spec:'pick-fast.json' },
  'sk-spin': { label:'หมุน', base:M+'mara/skills/spin/', raw:'strip-fast.png', blade:n=>n==7?'strip-fast-blade-7.png':'strip-fast.png', spec:'pick-fast.json' },
  'sk-leap': { label:'กระโดดฟาด', base:M+'mara/skills/leap/', raw:'strip-fast.png', blade:n=>n==7?'strip-fast-blade-7.png':'strip-fast.png', spec:'pick-fast.json' },
  'sk-dash': { label:'พุ่งผ่าน', base:M+'mara/skills/dash/', raw:'strip-fast.png', blade:n=>n==7?'strip-fast-blade-7.png':'strip-fast.png', spec:'pick-fast.json' },
  'sk-ground': { label:'ปักดาบ (บัฟ)', base:M+'mara/skills/ground/', raw:'strip-fast.png', blade:n=>n==7?'strip-fast-blade-7.png':'strip-fast.png', spec:'pick-fast.json' },
  'sk-flurry': { label:'แทงรัว', base:M+'mara/skills/flurry/', raw:'strip-fast.png', blade:n=>n==7?'strip-fast-blade-7.png':'strip-fast.png', spec:'pick-fast.json' },
  'sk-warcry': { label:'ตะโกน (บัฟ)', base:M+'mara/skills/warcry2/', raw:'strip-fast.png', blade:n=>n==7?'strip-fast-blade-7.png':'strip-fast.png', spec:'pick-fast.json' },

const ELEMS = { none:'ไม่มี', fire:'ไฟ', ice:'น้ำแข็ง', poison:'พิษ', lightning:'สายฟ้า' };

// AI battle: skills on cooldown (ms); when nothing is ready the basic 3-hit combo plays. Recovery frames are skipped

const A = {};

    A.expanded[key] = { img: await img(expandedBase + spec.sheet), w:spec.frameWidth, h:spec.frameHeight,
      cols:spec.cols, times:spec.frames.map(f=>f.durationMs), duration:spec.totalEffectMs, anchor:[32,32] };
  }
  A.expanded.lightning = { img:await img('../../concepts/fx-g10/codex/lightning-v2.png'),
    w:256, h:256, cols:4, times:[20,30,25,45], duration:120, anchor:[32,52] };
  A.hits = await json(M + 'fx/hits/hits.json');
  for (const [e, list] of Object.entries(A.hits)) for (const h of list) h.img = await img(M + 'fx/hits/' + h.file);
  A.kiki = [];
  for (const i of [0,38,40,41,42,43,44,46]) A.kiki.push(await img(`${M}monsters/kiki/hurt-death/frames/frame-${String(i).padStart(2,'0')}.png`));

function buttons(id, opts, key) {
  const el = document.getElementById(id); el.innerHTML = '';

    const b = document.createElement('button'); b.textContent = v; b.className = String(st[key]) === k ? 'on' : '';

  }
}

let flashT = 0, atk = null, t = 0, stopUntil = 0, shakeT = 0, shakeA = 0, parts = [], texts = [], bursts = [];

const LABEL = { fire:'ติดไฟ', ice:'หนาว', poison:'พิษ', lightning:'ช็อต' };
const TINT = { fire:'rgba(255,120,40,0.18)', ice:'rgba(120,200,255,0.45)', poison:'rgba(110,220,70,0.32)', lightning:'rgba(255,240,120,0.25)' };
let spots = null, statusParts = [];
function maskPoints(im) {                              // opaque pixels of the enemy sprite, for status spots
  const o = new OffscreenCanvas(im.width, im.height), oc = o.getContext('2d'); oc.drawImage(im, 0, 0);
  const d = oc.getImageData(0, 0, im.width, im.height).data, pts = [];
  for (let y = 0; y < im.height; y++) for (let x = 0; x < im.width; x++) if (d[(y*im.width+x)*4+3] > 0) pts.push([x, y]);
  return pts;
}
function drawStatus(k, fx, fy) {
  if (!spots) spots = maskPoints(A.kiki[0]);

  const o = new OffscreenCanvas(k.width, k.height), oc = o.getContext('2d'); oc.drawImage(k, 0, 0);
  oc.globalCompositeOperation = 'source-atop'; oc.fillStyle = TINT[e]; oc.fillRect(0, 0, k.width, k.height); cx.drawImage(o, fx, fy);

  for (const p of statusParts) {
    p.age += 16; const c = p.age < 80 ? R[0] : p.age < 170 ? R[1] : R[2];
    if (e === 'fire')      { cx.fillStyle = c; cx.fillRect(Math.round(p.x), Math.round(p.y - p.age/40), 1, 2); cx.fillStyle = R[0]; cx.fillRect(Math.round(p.x), Math.round(p.y - p.age/40) - 1, 1, 1); }
    if (e === 'poison')    { cx.fillStyle = c; cx.fillRect(Math.round(p.x), Math.round(p.y - p.age/30), 1, 1); }
    if (e === 'ice')       { if (p.age < 120) { cx.fillStyle = '#fff'; cx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); } }
    if (e === 'lightning') { if (p.age < 90) { cx.strokeStyle = R[0]; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x + 2, p.y + 2); cx.lineTo(p.x, p.y + 4); cx.stroke(); } }
  }
}
// slash arcs: Codex G11 sheets (4 frames of 64x64, white/grey/dark roles), recoloured per element
const ARC_FILES = { down:'arc-down', rl:'arc-sweep-rl', lr:'arc-sweep-lr', up:'arc-up', thrust:'arc-thrust', spin:'arc-spin' };
const ARC_PLAN = {
  'sk-thrust':[{k:'thrust',s:1.5}], 'sk-rising':[{k:'up',s:1.5}], 'sk-spin':[{k:'spin',s:1.4}], 'sk-leap':[{k:'down',s:1.6}],
  'sk-dash':[{k:'thrust',s:1.9}], 'sk-ground':[{k:'down',s:1.4}], 'sk-flurry':[{k:'thrust',s:1.2}], 'sk-warcry':[{k:'spin',s:1.8}],
  slash:[{k:'down',s:1.35}], combo:[{k:'down',s:1.35},{k:'rl',s:1.4},{k:'lr',s:1.8}] };
const ARC_COL = { none:['#ffffff','#9fe8ff','#2f5fd0'], fire:['#fff6c8','#ff9a2e','#a8281a'], ice:['#ffffff','#7fe0ff','#2f5fd0'],
                  poison:['#f2ffd0','#7be03c','#1f6a2a'], lightning:['#ffffff','#ffe95a','#7a4cff'] };
const ARC_MS = 32; let arcs = [], ARCS = {};
function hex(c) { return [1,3,5].map(i => parseInt(c.slice(i, i+2), 16)); }
async function loadArcs() {
  for (const [k, f] of Object.entries(ARC_FILES)) {
    const im = await img(`../../concepts/fx-g11/codex/${f}-native-v3.png`); ARCS[k] = {};
    for (const [e, cols] of Object.entries(ARC_COL)) {
      const o = new OffscreenCanvas(im.width, im.height), oc = o.getContext('2d'); oc.drawImage(im, 0, 0);
      const d = oc.getImageData(0, 0, im.width, im.height), p = d.data, C = cols.map(hex);
      for (let i = 0; i < p.length; i += 4) {
        const v = p[i];
        if (v < 20) { p[i+3] = 0; continue; }
        const c = v > 200 ? C[0] : v > 110 ? C[1] : C[2]; p[i] = c[0]; p[i+1] = c[1]; p[i+2] = c[2]; p[i+3] = 255;
      }
      oc.putImageData(d, 0, 0); ARCS[k][e] = o;

}
function spawnArc(move, hi, hitFrame) {
  const P = ARC_PLAN[move][Math.min(hi, ARC_PLAN[move].length - 1)], An = (A.anchors[move] || [])[hitFrame] || { body:[54,46], line:[60,46] };
  const sz = 64 * P.s; let x, y;                       // same rule as tools/arc_check2.py

  else if (P.k === 'spin') {                           // side view: the blade circles flat around the waist -> wide, flat ellipse

  }

function drawArcs(part) {                              // part: 'back' (top half of flat rings, behind the hero) or 'front'
  for (const a of arcs) {
    const sheet = ARCS[a.k] && ARCS[a.k][st.elem]; if (!sheet) continue;
    const f = Math.min(3, Math.floor(a.life / ARC_MS));

      cx.drawImage(sheet, f * 64, half, 64, 32, Math.round(a.x), Math.round(a.y + dy), a.w, a.h / 2); continue;
    }

function startAttack() { if (!atk) atk = { move: st.move, f: 0, acc: 0, hitDone: new Set() }; }

const STEP = [ // per hit of the combo: hit stop, shake, knockback, burst size, damage, flash

  { stop:0.8, shake:0.9, kb:7,  size:1.1, dmg:1.2, flash:100 },
  { stop:1.6, shake:2.2, kb:16, size:1.6, dmg:2.2, flash:110 } ];
function impact() {

  if (st.boom) bursts.push({ ...contact, e:'explosion', v:Math.floor(Math.random()*3),

  if (st.elem !== 'none') { if (foe.status !== st.elem) texts.push({ x: foe.x, y: G - 44, v: LABEL[st.elem], crit:false, life: 700, col: RAMP[st.elem][1], small:true }); foe.status = st.elem; foe.statusT = 2600; }

let last = performance.now();
function tick(now) {

      const sc = (b.e === 'lightning' ? 0.6 : 0.9) * (b.e === 'lightning' ? 1 : (b.s || 1));
