<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle Loot — Impact sprites</title><style>body{margin:0;padding:24px;background:#161a24;color:#e8eaf1;font:16px/1.5 Tahoma,sans-serif}main{max-width:1160px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#bec7d9}header{display:flex;justify-content:space-between;align-items:center;gap:16px}button{font:inherit;padding:9px 15px;background:#e7c77b;border:0;color:#18202a;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e7c77b;outline-offset:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;display:block;image-rendering:pixelated;background:#181b28}figcaption{margin-top:8px}a{color:#e7c77b}small{color:#bec7d9}@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:16px}header{align-items:flex-start}h1{font-size:21px}}</style><main><header><div><h1>ปะทะบนตัวมอน</h1><p>เฟรมใหม่: เริ่ม → กระแทก → กระจาย → ดับ</p></div><button id="pause" type="button">หยุดภาพ</button></header><div class="grid">
