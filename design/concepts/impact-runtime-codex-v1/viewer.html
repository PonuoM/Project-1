<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle Loot — ทดลองน้ำหนักการโจมตี</title>
<style>:root{color-scheme:dark;background:#191e20;color:#eee7d5;font-family:Tahoma,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:28px 24px}h1{font-size:28px;margin:0 0 8px;font-weight:600}p{line-height:1.65;color:#bcc8c1;margin:0 0 22px}#stage{background:#202b2b;width:100%;aspect-ratio:8/3}canvas{display:block;max-width:100%;image-rendering:pixelated}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0}button,select{font:inherit;min-height:44px;border:1px solid #63746a;background:#26332e;color:#eee7d5;padding:9px 16px;border-radius:4px}button:hover{background:#394b41}button:disabled{opacity:.5}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #efd383;outline-offset:3px}#attack{background:#efd383;color:#23261e;border-color:#efd383;font-weight:bold}label{display:flex;align-items:center;gap:8px;min-height:44px}input{accent-color:#efd383}output{font-variant-numeric:tabular-nums}#stats{display:flex;flex-wrap:wrap;gap:24px;padding:16px 0;border-top:1px solid #465449}#events{min-height:44px;color:#d3b977;line-height:1.6}footer{color:#bcc8c1;font-size:14px;line-height:1.7;border-top:1px solid #465449;padding-top:18px}::selection{background:#efd383;color:#191e20}@media(max-width:600px){main{padding:20px 12px}h1{font-size:23px}.controls{gap:8px}button,select{padding:8px 12px}#stats{gap:12px}}</style>
<main><h1>ลองน้ำหนักการโจมตี</h1><p>ง้าง → พุ่ง → ค้างตอนโดน → ส่งแรงไปที่ศัตรู · กด Space เพื่อฟัน</p><div id="stage" role="img" aria-label="ฮีโร่ฟันสไลม์ด้วย Phaser"></div>
<div class="controls"><label for="mode">จังหวะ<select id="mode"><option value="heavy">หนักแน่น</option><option value="plain">ธรรมดา · เทียบก่อนปรับ</option><option value="combo">คอมโบ 3 จังหวะ</option></select></label><button id="attack">โจมตี</button><button id="reset">เริ่มใหม่</button><button id="miss">ย้ายเป้าให้ฟันวืด</button><button id="face">กลับด้าน</button></div>
<div class="controls"><label><input id="reduced" type="checkbox"> ลดการสั่น</label><label><input id="sound" type="checkbox"> เสียงทดลอง</label><label for="speed">ความเร็ว<select id="speed"><option value="1">1×</option><option value="0.5">0.5× · ดูจังหวะ</option></select></label><label for="fps">เฟรมเรต<select id="fps"><option value="60">60 FPS</option><option value="30">30 FPS</option></select></label></div>
<div id="stats"><span>โดน <output id="hits">0</output> ครั้ง</span><span>HP เป้า <output id="hp">5</output>/5</span><span>จังหวะ <output id="phase">พร้อม</output></span><span>เวลาจริง <output id="clock">0.00</output>s</span></div><div id="events" aria-live="polite">เลือกจังหวะ แล้วกดโจมตี</div><footer>รันสดด้วย Phaser จากโปรเจกต์ · ใช้เฟรมฮีโร่และอาวุธเดิม · HP นี้เป็นเป้าทดลอง<br>ต้นแบบอยู่ใน design/ ยังไม่ได้เชื่อมรางวัลหรือแก้เกมหลัก</footer></main>
<script src="assets/phaser.min.js"></script><script type="module" src="demo.mjs"></script></html>
